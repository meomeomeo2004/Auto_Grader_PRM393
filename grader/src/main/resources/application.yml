spring:

  application:
    name: grader

  # VAI của bản đang chạy — quyết định controller nào được nạp (xem config/Vai.java).
  #   GRADER_ROLE=gv  → bản giảng viên     GRADER_ROLE=nc  → bản người chấm
  # KHÔNG có mặc định, và không còn "bản thấy cả hai vai": bản đó là cấu hình duy nhất không đi
  # qua khâu bàn giao, nên cũng là cấu hình duy nhất che được một khâu bàn giao đang hỏng.
  # Bỏ trống thì VaiBatBuoc chặn ngay lúc khởi động, không để chạy lên rồi mọi API trả 404.
  profiles:
    active: ${GRADER_ROLE:}
  datasource:
    # KHÔNG có giá trị mặc định, và đó là cố ý — giống spring.profiles.active ngay phía trên.
    # Schema do VAI quyết định (chamthi_gv / chamthi_nc), mà vai thì start-all.ps1 đọc từ
    # vai-cau-hinh.ps1 rồi đặt vào biến này kèm createDatabaseIfNotExist=true. Ghi một mặc
    # định ở đây là dựng nguồn sự thật thứ hai cho tên schema, sớm muộn cũng lệch với
    # vai-cau-hinh.ps1 — và lệch kiểu đó thì backend vẫn chạy, chỉ là ghi vào nhầm schema.
    # Thà chết ngay lúc khởi động với đúng tên biến còn thiếu.
    #
    # Giá trị mặc định dưới đây KHÔNG phải một chuỗi kết nối — nó là lời nhắn. Để trống hẳn
    # thì Hikari in ra "Driver claims to not accept jdbcUrl, ${SPRING_DATASOURCE_URL}", đọc
    # như lỗi driver và không ai đoán ra phải làm gì. Nhét câu hướng dẫn vào đúng chỗ MySQL
    # in ra thì thông báo lỗi tự nói ra cách sửa.
    url: ${SPRING_DATASOURCE_URL:CHUA-DAT-BIEN-SPRING_DATASOURCE_URL---hay-chay-bang---run--Vai-gv---hoac---run--Vai-nc---vi-schema-do-vai-quyet-dinh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      # CHỈ ép chiều request. force:true (cả hai chiều) dán ;charset=UTF-8 vào MỌI
      # response — WebAssembly.compileStreaming từ chối 'application/wasm;charset=UTF-8'
      # nên SQLite web của Golden runtime chết ngay lúc nạp. JSON/HTML không cần ép:
      # JSON là UTF-8 theo chuẩn, index của Flutter tự khai <meta charset>.
      force-request: true
      force-response: false
    multipart:
      max-file-size: ${GRADER_MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${GRADER_MAX_UPLOAD:2GB}   # cho batch lớn
      file-size-threshold: 256KB                    # part lớn ghi ra đĩa tạm, không giữ trong RAM

server:
  # Hai bản có thể chạy song song trên cùng một máy nên cổng phải đổi được:
  # bản người chấm giữ 8080 như cũ, bản giảng viên dùng 8090 (script đóng gói ghi sẵn).
  port: ${SERVER_PORT:8080}
  tomcat:
    # Nộp CẢ LỚP trong một lần = mỗi bài một part. Tomcat mặc định chỉ cho 50 part/request,
    # nên upload 116 bài bị chặn ở tầng Tomcat TRƯỚC khi Spring nhìn thấy: trả 413 và cắt
    # kết nối, trình duyệt chỉ thấy "Failed to fetch" chứ không có thông báo nào dễ hiểu.
    # Giới hạn này đếm SỐ FILE chứ không phải dung lượng — 60 file 0.6MB vẫn bị chặn.
    # Lưu ý: examId cũng chiếm 1 part, nên 1000 = tối đa 999 file mỗi lần nộp.
    max-part-count: ${GRADER_MAX_PART_COUNT:1000}

grader:
  # Thư mục chứa Dockerfile.base/template, pubspec.base.yaml, scripts, run_grader.sh
  template-dir: ${GRADER_TEMPLATE_DIR:grader-base}
  # Nơi dựng build context cho từng đề thi
  exams-dir: ${GRADER_EXAMS_DIR:exams}
  # Flutter Web Golden builds used by the Record–Abstract–Replay authoring screen.
  golden-runtime-dir: ${GRADER_GOLDEN_RUNTIME_DIR:golden-runtimes}
  golden-runtime-build-timeout-seconds: ${GRADER_GOLDEN_RUNTIME_BUILD_TIMEOUT_SECONDS:420}
  # Replay một record trên Golden + Hidden DB và capture Output DB/oracle.
  golden-capture-timeout-seconds: ${GRADER_GOLDEN_CAPTURE_TIMEOUT_SECONDS:240}
  # Ảnh nền dùng chung — build 1 lần, mọi đề thi kế thừa (FROM grading-base).
  # GHIM THEO NHÃN PHIÊN BẢN, KHÔNG dùng `latest`: điểm của sinh viên phụ thuộc vào
  # ảnh này, nên đổi ảnh phải là một dòng nhìn thấy được trong git chứ không phải
  # chuyện xảy ra âm thầm khi ai đó build lại máy mình.
  # Đổi nhãn thì build trước: grader-base/build-base.ps1 hoặc
  #   docker build -f Dockerfile.base --build-arg GRADER_BASE_VERSION=<nhãn> -t grading-base:<nhãn> .
  # 2026-08-22:  ảnh đầu tiên có pipeline 4 tầng (static_checks + merge_grade_results
  #              + analysis_options.yaml). Bản lùi: grading-base:pre-pipeline.
  # 2026-08-22b: rút gọn result.json — bỏ expected, score, và 9 nhãn phân loại.
  # 2026-08-22c: dòng đạt không còn 5 field mô tả lỗi (chỉ dòng trượt mới có).
  # 2026-08-22d: checkpoint component_present (chấm giao diện) + tôn trọng actual_source.
  # 2026-08-22e: luật tĩnh source_pattern (chấm Kiến trúc MVVM/Riverpod qua cây file
  #              + regex nội dung; chạy được cả khi bài không biên dịch).
  base-image: ${GRADER_BASE_IMAGE:grading-base:2026-08-22e}
  # Lưu lại bài nộp (zip) để audit/chấm lại khi tranh chấp
  save-submissions: ${GRADER_SAVE_SUBMISSIONS:true}
  submissions-dir: ${GRADER_SUBMISSIONS_DIR:submissions}
  # Số ngày giữ bài nộp (<=0 = giữ mãi); dọn tự động 3h sáng hằng ngày
  submissions-retention-days: ${GRADER_SUBMISSIONS_RETENTION_DAYS:30}
  # Ngưỡng điểm đạt (hệ 10) cho thống kê Pass/Fail
  pass-threshold: ${GRADER_PASS_THRESHOLD:5}
  image:
    prefix: ${GRADER_IMAGE_PREFIX:grading-env}
  # Mặc định 3 container để không tranh CPU quá mức khi mỗi container có quota 2 CPU.
  # Máy mạnh có thể tăng bằng GRADER_MAX_CONCURRENT.
  # LƯU Ý: giá trị ở đây chỉ là MẶC ĐỊNH ban đầu. Giáo viên chỉnh trực tiếp trong trang
  # "Chấm bài tự động" → thẻ "Hiệu năng chấm"; lựa chọn đó lưu DB (grading_runtime_settings)
  # và ĐÈ các giá trị max.concurrent / run.cpus / run.memory / timeout.seconds dưới đây.
  max:
    concurrent: ${GRADER_MAX_CONCURRENT:3}
    # Trần cứng cho ô "số bài chấm song song" trên giao diện (chặn gõ nhầm 999 làm treo máy)
    concurrent-limit: ${GRADER_MAX_CONCURRENT_LIMIT:16}
  timeout:
    seconds: ${GRADER_TIMEOUT_SECONDS:240}
  runner:
    # Mỗi nhóm có tối đa 120 giây (bao gồm compile Flutter). APP_BOOT được engine
    # tách riêng và chặn ở 60 giây để phát hiện bài treo sớm mà không làm mất cả lô.
    process-timeout-seconds: ${GRADER_RUNNER_PROCESS_TIMEOUT_SECONDS:120}
  # Tài nguyên mỗi container chấm. Máy yếu/ít RAM: giảm các giá trị này hoặc GRADER_MAX_CONCURRENT.
  run:
    cpus: ${GRADER_RUN_CPUS:2.0}
    memory: ${GRADER_RUN_MEMORY:2048m}
  analyze:
    # Mặc định bật để giữ cảnh báo dart analyze trong JSON kết quả.
    enabled: ${GRADER_ANALYZE_LIB:true}
