name: exam_project
description: Grading template
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Quản lý qua trang "Thư viện chấm". 'flutter' là lõi (không xóa).
  flutter:
    sdk: flutter
  intl: '^0.20.2'
  flutter_riverpod: '^2.5.1'
  riverpod_annotation: '^2.6.1'
  path: '^1.9.1'
  sqflite: '>=2.4.2+1 <2.4.3'
  sqflite_common_ffi: '>=2.4.0 <2.4.1'
  sqflite_common_ffi_web: '>=1.1.0 <1.1.2'
  image_picker: '^1.2.3'
  path_provider: '^2.1.6'
  sembast_web: '^2.4.5+1'
  shared_preferences: '^2.5.0'
  shared_preferences_platform_interface: '^2.4.2'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Anh di kem de thi duoc mount vao /app/assets luc cham. Phai khai o day thi
  # `flutter test` moi dong chung vao goi tai nguyen; thieu dong nay thi Image.asset
  # nem "Unable to load asset" du file da nam dung cho (do 8/9/2026).
  assets:
    - assets/
