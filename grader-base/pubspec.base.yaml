name: exam_project
description: Grading template
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Quản lý qua trang "Thư viện chấm". 'flutter' là lõi (không xóa).
  flutter:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.5.1
  # Các bài nộp được phép dùng các adapter/state generator phổ biến này.
  riverpod_annotation: ^2.6.1
  path: ^1.9.1
  # 2.4.3 yêu cầu Dart 3.12; 2.4.2+1 hỗ trợ Dart 3.10.
  sqflite: '>=2.4.2+1 <2.4.3'
  # Giới hạn để image chấm tương thích Dart 3.10; 2.4.1+ yêu cầu Dart 3.12.
  sqflite_common_ffi: '>=2.4.0 <2.4.1'
  # 1.1.2 yêu cầu Dart 3.12; 1.1.1 vẫn tương thích Dart 3.10.
  sqflite_common_ffi_web: '>=1.1.0 <1.1.2'
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  sembast_web: ^2.4.5+1
  # Bộ nhớ nhanh của app. Engine cũng import gói này: nó phải TỰ dựng kho giả trước khi
  # mở app, vì trong flutter_test không có plugin nền tảng nào nên bài nộp chạm vào
  # SharedPreferences là chết ngay với MissingPluginException.
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Anh di kem de thi duoc mount vao /app/assets luc cham. Phai khai o day thi
  # `flutter test` moi dong chung vao goi tai nguyen; thieu dong nay thi Image.asset
  # nem "Unable to load asset" du file da nam dung cho (do 8/9/2026).
  assets:
    - assets/
