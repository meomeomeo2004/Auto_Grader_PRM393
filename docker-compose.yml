# docker-compose.yml
#
#  File này chỉ dựng MySQL. Không có gì khác.
#    docker compose up -d
#
#  Backend chạy trên HOST, không chạy trong container: nó build và mount thư mục bài nộp
#  qua docker.sock của host nên đường dẫn phải là đường dẫn host thật. Và từ khi tách hai
#  vai thì mỗi lần chạy phải khai vai, nên đường chạy duy nhất là:
#      .\run -Vai gv        (hoặc -Vai nc)
#  hay trong một bản đã đóng gói thì bấm GraderLauncher.exe.
#
#  KHÔNG tạo sẵn database ở đây. Schema do VAI quyết định (chamthi_gv / chamthi_nc, xem
#  vai-cau-hinh.ps1) và chuỗi kết nối mang sẵn createDatabaseIfNotExist=true nên backend
#  tự tạo schema của mình ở lần chạy đầu. Trước đây chỗ này tạo sẵn `chamthi_db` kèm một
#  init.sql dựng tay 6 bảng theo hình dạng CŨ — chính bộ bảng dựng tay đó đã che mất lỗi
#  DDL `CURRENT_TIMESTAMP` trên cột datetime(6), vì trên schema có sẵn bảng thì Hibernate
#  không phải tạo bảng nên không ai thấy lỗi. Nay bỏ hẳn: Hibernate dựng toàn bộ bảng.

services:
  mysql:
    image: mysql:8.0
    container_name: chamthi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"     # khớp default backend (root/123456) → clone về chạy ngay
      MYSQL_USER: chamthi               # user phụ, chỉ dùng cho healthcheck bên dưới
      MYSQL_PASSWORD: chamthi123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "chamthi", "-pchamthi123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Service `grader-api` (chạy backend trong container, sau `--profile full`) đã bỏ 14/9/2026.
  # Nó không còn chạy được từ khi tách hai vai: một container thì là vai nào? Nó không đặt
  # GRADER_ROLE nên VaiBatBuoc chặn ngay lúc khởi động, nó trỏ vào `chamthi_db` đã xoá, và nó
  # mount ./exams — thư mục nay thuộc về từng bản trong dist chứ không nằm ở gốc repo nữa.

volumes:
  mysql_data:
